services:
  viblake:
    build: .
    image: viblake:latest
    container_name: viblake
    ports:
      - "8000:8000"
    volumes:
      - viblake-data:/data
    environment:
      VIBLAKE_DATA_DIR: /data
      VIBLAKE_MAX_BATCH_ROWS: "10000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped

volumes:
  viblake-data:
